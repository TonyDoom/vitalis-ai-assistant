services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vitalis-backend
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vitalis-frontend
    environment:
      API_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
